# Настройки gitleaks. Проверяем историю целиком: секрет, попавший в коммит и
# удалённый следующим коммитом, всё равно опубликован.
[extend]
useDefault = true

[allowlist]
description = "Артефакты сборки и чужой код: детектор энтропии на них шумит"
paths = [
  '''\.pio/''',
  '''node_modules/''',
  '''^data/''',
  '''\.angular/''',
]
