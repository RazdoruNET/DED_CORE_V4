; DED CORE V4. Два варианта сборки:
;   pio run -e esp32dev         — полная прошивка (новая разметка: слоты 1664 КБ, ФС 704 КБ)
;   pio run -e esp32dev_legacy  — прошивка перехода для устройств с заводской разметкой (слот 1280 КБ)
;
; Оба варианта живут в одном файле намеренно: при переключении между разными
; конфигурациями PlatformIO стирает каталог сборки и всё пересобирается заново.

[platformio]
default_envs = esp32dev
; Вшитый фронт кладём в образ сжатым: scripts/gzip_frontend.py собирает .pio/frontend
; из data/ (рядом с каждым текстовым файлом — его копия .gz).
data_dir = .pio/frontend

[env]
; Сжатые копии фронта собираются перед образом файловой системы (см. scripts/).
extra_scripts = pre:scripts/gzip_frontend.py
; Версия платформы закреплена намеренно. Без неё PlatformIO ставит свежий
; espressif32 (8.0.0 с Arduino core 3.x), где убраны API, на которых держится
; прошивка (ledcSetup/ledcAttachPin, mbedtls_sha256_*_ret), и сборка падает.
; На железе проверено это ядро: Arduino 2.0.17 / IDF 4.4.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Образ файловой системы записывается скриптом flash-device.sh: esptool падает на
; сжатой записи большого образа («Failed to leave compressed flash mode (C900)»),
; а флаг --no-compress относится к подкоманде write_flash и через upload_flags
; (они подставляются до подкоманды) не проходит.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS
    ; ArduinoOTA дублирует POST /api/update и обновление по команде сервиса,
    ; а в заводской прошивке этот путь и так был отключён. Освобождает флеш.
    -DDED_CORE_NO_ARDUINO_OTA
    ; Размеры буферов mbedTLS задаются при сборке библиотек ядра (см. ниже), а не здесь:
    ; эти -D попадали только в исходники прошивки, libmbedtls оставался прежним, и
    ; значение расходилось с библиотекой.

;; Плата с пищалкой/шифт-лайтом на GPIO32 собирается с -DDED_CORE_SOUND=true
;; (см. src/config/PROPS_DEF.h): тогда GPIO32 — выход, и создаётся задача аварийной
;; сигнализации. Без флага GPIO32 остаётся кнопкой «карта вверх».

; Полная прошивка: TLS, Bluetooth, обновление по воздуху, смена разметки.
[env:esp32dev]
board_build.partitions = partitions_ded_core.csv
build_flags =
    ${env.build_flags}
    ; Стек задачи стека Bluetooth: в её колбэке выполняется запись GATT. 4096 байт
    ; по умолчанию в притык — переполнение стека роняло блок (double exception
    ; в log_printfv при записи настройки в NVS).
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
    ; Урезанный хост NimBLE: блоку нужно одно соединение и один канал телеметрии.
    ; Каждое из этих значений экономит по нескольку килобайт кучи (пулы msys, CCCD).
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=6
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
; LittleFS вместо SPIFFS: SPIFFS теряет ~30 % раздела на служебные структуры, а фронт
; с запасом под будущие страницы лучше держать в файловой системе. Подробности — в
; src/core/storage/DEVICE_FS.h.
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^5.13.4
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    Links2004/WebSockets@^2.4.1
    h2zero/NimBLE-Arduino@^1.4.1

; Библиотеки ядра собраны отдельно (см. docs/technical/production-security.md): BT-контроллер
; только BLE, буферы mbedTLS 8 КБ на приём и 4 КБ на передачу, окна TCP 2920. Входной
; буфер меньше 8 КБ делать нельзя: сервисный TLS-клиент (обновление и сертификат) портит кучу.
;
; Сборка без Bluetooth: HTTPS/WSS работают постоянно, память не делится с NimBLE.
; Обычная сборка (esp32dev) тоже умеет HTTPS — она отпускает Bluetooth на время TLS и
; забирает у ядра резерв DRAM контроллера (см. src/core/net/TLS_SERVER.cpp). Это
; окружение остаётся для блоков, которым Bluetooth не нужен вовсе: там TLS-сессии
; дешевле, а возврат к BLE не требует перезагрузки. Разметка и файловая система — те же.
[env:esp32dev_https]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDED_CORE_NO_BLE

; Прошивка перехода на заводские устройства. Принимается их обновлением по воздуху,
; переносит настройки владельца в NVS, переводит флеш на новую разметку и укладывает
; полную прошивку. Без Bluetooth: полный BLE-стек (≈252 КБ) в слот 1280 КБ не влезает.
[env:esp32dev_legacy]
board_build.partitions = partitions_legacy.csv
lib_deps =
    bblanchon/ArduinoJson@^5.13.4
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    Links2004/WebSockets@^2.4.1
build_flags =
    ${env.build_flags}
    -DDED_CORE_NO_BLE
    ; Заводская разметка: файловая система здесь SPIFFS (в ней лежит /config.json
    ; завода), и её форматировать нельзя — иначе владелец потеряет свои карты.
    -DDED_CORE_LEGACY_LAYOUT
