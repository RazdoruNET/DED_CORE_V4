; DED CORE V4. Два варианта сборки:
;   pio run -e esp32dev         — полная прошивка (новая разметка: слоты 1472 КБ, SPIFFS 1088 КБ)
;   pio run -e esp32dev_legacy  — прошивка перехода для устройств с заводской разметкой (слот 1280 КБ)
;
; Оба варианта живут в одном файле намеренно: при переключении между разными
; конфигурациями PlatformIO стирает каталог сборки и всё пересобирается заново.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Образ файловой системы записывается скриптом flash-device.sh: esptool падает на
; сжатой записи большого образа («Failed to leave compressed flash mode (C900)»),
; а флаг --no-compress относится к подкоманде write_flash и через upload_flags
; (они подставляются до подкоманды) не проходит.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS
    ; ArduinoOTA дублирует POST /api/update и обновление по команде сервиса,
    ; а в заводской прошивке этот путь и так был отключён. Освобождает флеш.
    -DDED_CORE_NO_ARDUINO_OTA

; Полная прошивка: TLS, Bluetooth, обновление по воздуху, смена разметки.
[env:esp32dev]
board_build.partitions = partitions_ded_core.csv
; LittleFS вместо SPIFFS: в разделе 1088 КБ SPIFFS вмещает ~780 КБ, а вшитый фронт
; занимает ~900 КБ — образ файловой системы не собирался вовсе. Подробности — в
; src/core/storage/DEVICE_FS.h.
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^5.13.4
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    Links2004/WebSockets@^2.4.1
    h2zero/NimBLE-Arduino@^1.4.1

; Прошивка перехода на заводские устройства. Принимается их обновлением по воздуху,
; переносит настройки владельца в NVS, переводит флеш на новую разметку и укладывает
; полную прошивку. Без Bluetooth: полный BLE-стек (≈252 КБ) в слот 1280 КБ не влезает.
[env:esp32dev_legacy]
board_build.partitions = partitions_legacy.csv
lib_deps =
    bblanchon/ArduinoJson@^5.13.4
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    Links2004/WebSockets@^2.4.1
build_flags =
    ${env.build_flags}
    -DDED_CORE_NO_BLE
    ; Заводская разметка: файловая система здесь SPIFFS (в ней лежит /config.json
    ; завода), и её форматировать нельзя — иначе владелец потеряет свои карты.
    -DDED_CORE_LEGACY_LAYOUT
