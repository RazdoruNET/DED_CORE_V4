version: 2

# Зависимости фронта и сами экшены CI обновляются сами: встроенная страница
# собирается из web/, а её зависимости попадают в образ файловой системы блока.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Пакеты Angular обязаны быть одной версии: compiler-cli принимает ровно тот же
    # compiler, что стоит в проекте. Когда бот приносил их по одному, половина PR
    # обновляла compiler/core, а compiler-cli оставался старым — и `npm ci` в сборке
    # блока падал с ERESOLVE. Миноры и патчи приходят одним PR.
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
    # Мажоры Angular — это миграция (ng update + правка кода + сборка), а не
    # обновление версии в package.json. Обновляем их руками; миноры и патчи —
    # ботом, одним PR на всю группу (groups выше). Набор проверяет job
    # «Сборка фронта» в security.yml, поэтому несовместимый не пройдёт.
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
      # TypeScript 7 — другой компилятор, а не новая версия: переход требует
      # смены @angular/build и проверки сборки.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
