version: 2

# Зависимости фронта и сами экшены CI обновляются сами: встроенная страница
# собирается из web/, а её зависимости попадают в образ файловой системы блока.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Мажоры Angular — это миграция (ng update + правка кода + сборка), а не
    # обновление версии в package.json. Бот приносил по одному пакету Angular
    # на PR, и каждый такой PR проходил CI, потому что фронт в CI не собирается.
    # Мажоры обновляем руками, миноры и патчи — как раньше.
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
