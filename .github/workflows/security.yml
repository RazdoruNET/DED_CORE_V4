name: security

# Репозиторий публичный, поэтому проверяем не только сборку, но и отсутствие
# секретов: в истории, в дереве и в зависимостях фронта.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Запрещённые файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ключи, секреты и артефакты сборки не должны попадать в git
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|der|token)$|(^|/)Secrets\.h$|(^|/)secrets\.h$|^\.dev/|^\.pio/|(^|/)node_modules/' || true)
          if [ -n "$bad" ]; then
            echo "Эти файлы не должны быть в репозитории:"
            echo "$bad"
            exit 1
          fi

  dependencies:
    name: Зависимости фронта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  firmware:
    name: Сборка прошивки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --upgrade platformio
      - run: pio run -e esp32dev
